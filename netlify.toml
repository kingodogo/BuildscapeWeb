[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 5173
  framework = "#custom"
  
[[redirects]]
  from = "/api/v1/supporters/connect/*"
  to = "/.netlify/functions/v1-supporters-connect?uuid=:splat"
  status = 200

[[redirects]]
  from = "/api/v1/supporters/cosmetics/*"
  to = "/.netlify/functions/v1-supporters-cosmetics?uuid=:splat"
  status = 200

[[redirects]]
  from = "/api/v1/supporters/status/*"
  to = "/.netlify/functions/v1-supporters-status?uuid=:splat"
  status = 200

[[redirects]]
  from = "/api/v1/tiers"
  to = "/.netlify/functions/v1-supporters-tiers"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
